<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#071018">
    <meta name="description" content="两个人在同一台设备上玩的本地三轮软垫相扑。">
    <title>软软相扑</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell" id="soft-sumo-app" data-phase="intro">
      <nav class="utility-bar" aria-label="比赛工具">
        <a href="../../../index.html">返回作品集</a>
        <span id="local-only">只在本机运行，刷新即重置。</span>
        <button type="button" class="quiet-action" id="pause-button" data-action="pause" hidden>暂停</button>
      </nav>

      <header class="match-header">
        <div class="title-copy">
          <h1 id="game-title">软软相扑</h1>
          <p id="game-subtitle">推我可以，先站稳自己。</p>
        </div>
        <section class="scoreboard" aria-label="三轮比分">
          <p><span class="seat-mark seat-mark--berry">01</span><span id="player-name-0">莓果</span><strong id="score-0">0</strong></p>
          <span class="score-divider" aria-hidden="true">—</span>
          <p><strong id="score-1">0</strong><span id="player-name-1">海盐</span><span class="seat-mark seat-mark--salt">02</span></p>
        </section>
        <p class="round-label" id="round-label">第 1 / 3 轮</p>
      </header>

      <section class="arena-section" aria-labelledby="arena-heading">
        <h2 class="visually-hidden" id="arena-heading" tabindex="-1">软软相扑擂台</h2>
        <div class="arena-frame" id="arena-frame" role="group" aria-describedby="arena-description">
          <div class="arena-ring" id="arena-ring" aria-hidden="true"></div>
          <div class="token token--berry" id="token-0" aria-hidden="true">
            <span class="token-sprite"></span><span class="token-fallback">01</span><span class="aim-arrow"></span>
          </div>
          <div class="token token--salt" id="token-1" aria-hidden="true">
            <span class="token-sprite"></span><span class="token-fallback">02</span><span class="aim-arrow"></span>
          </div>
          <div class="phase-layer" id="phase-layer"></div>
        </div>
        <p class="visually-hidden" id="arena-description">圆形擂台内有两枚软垫棋子。转向后按住蓄力，松开即可冲刺。</p>
      </section>

      <p class="rule-line" id="game-rule">转向，按住，松开冲出去。</p>
      <section class="controls-host" id="controls-host" aria-label="双方操作"></section>
      <p class="match-status" id="match-status">准备开始第一轮。</p>
      <p class="live-region" id="live-region" role="status" aria-live="polite" aria-atomic="true"></p>
      <noscript>软软相扑需要启用 JavaScript；页面不会联网，也不会保存比赛数据。</noscript>
    </main>

    <script src="config.js"></script>
    <script src="logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
