<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4efe6" />
    <title>这一拍，刚好和你 · Two of Us</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./config.js" defer></script>
    <script src="../../../shared/audio/tone-player.js" defer></script>
    <script src="./logic.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main id="harmony-app" class="app">
      <nav class="topbar" aria-label="体验导航">
        <a class="back-link" href="../../../index.html">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
            <path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>返回 Two of Us</span>
        </a>
        <button id="sound-toggle" class="sound-toggle" type="button" role="switch" aria-checked="true" aria-label="声音开关">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
            <path d="M4 10v4h4l5 4V6L8 10H4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
            <path class="sound-wave" d="M17 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span id="sound-label">声音：开</span>
        </button>
      </nav>

      <header class="hero">
        <h1>这一拍，刚好和你</h1>
        <p>你接住低音，我接住高音。</p>
      </header>

      <section id="phase-host" class="phase-host" aria-label="合奏区域"></section>

      <p id="live-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
      <footer class="privacy">声音由浏览器即时合成；不录音、不联网、不保存。</footer>
      <noscript>需要启用 JavaScript 才能开始合奏。</noscript>
    </main>
  </body>
</html>
