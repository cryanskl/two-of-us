<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>今晚，点亮五支蜡烛</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="experience" data-phase="intro">
      <header class="page-heading">
        <h1>今晚，点亮五支蜡烛</h1>
      </header>
      <p class="instructions">读一条线索，点亮对应的蜡烛。选错不会失去什么；五盏都亮起后，会有一段话留给你。</p>
      <section class="candle-stage" hidden aria-label="蜡烛与蛋糕"></section>
      <p class="progress-status" hidden>还没有点亮第一盏。</p>
      <button class="primary-action" type="button" hidden>开始点亮</button>
      <p class="privacy-note">内容写在本地文件里；页面不会上传或另存，最后的话会在五盏都亮起后出现。</p>
      <p class="live-region" hidden role="status" aria-live="polite" aria-atomic="true"></p>
      <noscript>
        <p class="no-script">请开启 JavaScript 后再点亮这五支蜡烛。</p>
      </noscript>
    </main>
    <script src="config.js"></script>
    <script src="logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
